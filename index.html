<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Open Works | HarVyakti</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4facfe">


<style>
/* ================= Body & Global ================= */
body {
  margin:0;
  font-family:'Segoe UI',Tahoma,sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background: linear-gradient(to bottom,#e0f7fa,#ffffff);
}
a { text-decoration:none; color:inherit; }
button { cursor:pointer; transition:.3s; }

/* ================= Header ================= */
header {
  position:fixed; top:0; left:0; width:100%;
  background: linear-gradient(90deg,#4facfe,#00f2fe);
  box-shadow: 0 6px 12px rgba(0,0,0,.25);
  z-index:1000;
}
.header-container {
  max-width:1200px;
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
}
.logo {
  font-size:1.8rem;
  font-weight:bold;
  color:white;
  cursor:pointer;
  text-shadow: 1px 1px 3px rgba(0,0,0,.3);
}
nav a {
  color:white;
  text-decoration:none;
  margin-left:25px;
  font-weight:600;
  position:relative;
}
nav a::after {
  content:'';
  position:absolute;
  width:0;
  height:2px;
  bottom:-3px;
  left:0;
  background:#fff;
  transition:.3s;
}
nav a:hover::after { width:100%; }

/* ================= Main ================= */
main { flex:1; padding:140px 20px 20px; }

/* Filters */
.filters {
  display:flex;
  gap:10px;
  margin-bottom:25px;
  flex-wrap:wrap;
  justify-content:center;
}
.filters select {
  padding:10px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-weight:600;
  background: linear-gradient(135deg,#ffffff,#e3f2fd);
  box-shadow:0 2px 6px rgba(0,0,0,.1);
  transition:.3s;
}
.filters select:hover { transform:scale(1.03); }

/* ================= Cards ================= */
.work-card {
  background: linear-gradient(135deg,#ffffff,#e3f2fd);
  padding:18px;
  margin-bottom:18px;
  border-radius:12px;
  box-shadow:0 6px 15px rgba(0,0,0,.15);
  transition:.3s;
}
.work-card:hover {
  transform: translateY(-5px);
  box-shadow:0 10px 25px rgba(0,0,0,.2);
}
.work-card h3 { margin-bottom:5px; }
.work-card p { margin:6px 0; font-size:14px; }

/* Status badges */
.status-badge {
  padding:5px 10px;
  border-radius:6px;
  color:#fff;
  font-weight:600;
  font-size:12px;
  text-transform:capitalize;
}
.status-open { background:#2e7d32; }


/* Buttons */
button {
  padding:8px 14px;
  border:none;
  border-radius:8px;
  font-weight:600;
  color:#fff;
  background:linear-gradient(90deg,#4facfe,#00f2fe);
  margin-top:6px;
  margin-right:6px;
}
button:hover {
  transform:scale(1.05);
  box-shadow:0 4px 15px rgba(0,0,0,.2);
}
button:disabled {
  background:#aaa;
  cursor:not-allowed;
}

/* Comment Section */
.comment-section {
  display:none;
  margin-top:12px;
  border-top:1px solid #ccc;
  padding-top:10px;
}
.comment-item {
  margin-bottom:5px;
  font-size:14px;
  background:#f1f8ff;
  padding:6px 10px;
  border-radius:6px;
}
.comment-box {
  display:flex;
  gap:8px;
  margin-top:8px;
}
.comment-box input {
  flex:1;
  padding:6px 8px;
  border-radius:6px;
  border:1px solid #ccc;
  font-size:14px;
}

/* Empty State */
.empty {
  text-align:center;
  color:#555;
  margin-top:40px;
  font-weight:600;
  font-size:16px;
}

/* ================= Footer ================= */
footer {
  background:#1c1c1c;
  color:#fff;
  text-align:center;
  padding:15px 0;
  font-weight:600;
  box-shadow:0 -4px 10px rgba(0,0,0,.1);
}
</style>
</head>
<body>

<header>
  <div class="header-container">
    <div class="logo">HarVyakti</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
  </div>
</header>

<main>
<div class="filters">
  <select id="categoryFilter">
    <option value="all">All Categories</option>
    <option value="ride">Ride</option>
    <option value="work">Work</option>
    <option value="idea">Idea</option>
    <option value="problem">Problem</option>
  </select>

  <select id="distanceFilter">
    <option value="all">All distances</option>
    <option value="0.1">100 meters</option>
    <option value="1">1 km</option>
    <option value="5">5 km</option>
    <option value="10">10 km</option>
    <option value="50">50 km</option>
  </select>
</div>

<div id="worksContainer"></div>
</main>
<!-- Bottom-right Install Button -->
<button id="installBtn" 
        style="display:none; position:fixed; bottom:20px; right:20px; padding:10px 15px; background:#007bff; color:white; border:none; border-radius:8px; box-shadow:0 4px 6px rgba(0,0,0,0.2); cursor:pointer; z-index:1000;">
    Install App
</button>


<footer>© 2025 HarVyakti</footer>
<!-- Only JS part is modified, rest of HTML/CSS untouched -->
<script type="module">
  let lastRenderHash = "";

import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { collection, getDocs, doc, getDoc, updateDoc, arrayUnion, arrayRemove, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const worksContainer = document.getElementById("worksContainer");
const distanceFilter = document.getElementById("distanceFilter");
const categoryFilter = document.getElementById("categoryFilter");

let userLat = null, userLng = null;
let allWorks = [];
let currentUser = null;

// 🔐 Auth check (optional login)
onAuthStateChanged(auth, async user => {
  currentUser = user || null; // if not logged in, currentUser = null
  getUserLocation();
  await subscribeToPosts();
});

distanceFilter.addEventListener("change", renderWorks);
categoryFilter.addEventListener("change", renderWorks);

function getUserLocation(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    renderWorks();
  });
}

function getDistance(lat1,lng1,lat2,lng2){
  if(!lat1 || !lat2) return 0;
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// 🔹 Real-time subscription
async function subscribeToPosts(){
  const postsCol = collection(db,"posts");
  onSnapshot(postsCol, async snapshot => {
    allWorks = [];
    for(const d of snapshot.docs){
      const w = {id:d.id, ...d.data()};
      if(w.postedBy){
        try{
          const userSnap = await getDoc(doc(db,"users",w.postedBy));
          w.senderName = userSnap.exists() ? (userSnap.data().name || "Unknown") : "Unknown";
        } catch(e){ w.senderName = "Unknown"; }
      } else w.senderName = "Unknown";

      if(!w.likes) w.likes = [];
      if(!w.comments) w.comments = [];
      allWorks.push(w);
    }
    renderWorks(true);
  });
}

// 🔹 Make functions global with login check
window.acceptWork = async function(workId){
  if(!currentUser){ 
    alert("Please login to accept work");
    location.href = "login.html";
    return;
  }
  const work = allWorks.find(w=>w.id===workId);
  if(!work) return;
  if(work.postedBy === currentUser.uid) return alert("Cannot accept your own post");

  try{
    await updateDoc(doc(db,"posts",workId),{
      acceptedBy: currentUser.uid,
      status: "accepted"
    });
  }catch(e){ alert("❌ "+e.message); }
};

window.toggleComments = function(workId){
  const sec = document.getElementById("comments-"+workId);
  if(sec) sec.style.display = sec.style.display==="none"?"block":"none";
};

window.addComment = async function(workId, input){
  if(!currentUser){
    alert("Please login to comment");
    location.href = "login.html";
    return;
  }
  const text = input.value.trim();
  if(!text) return;
  try{
    await updateDoc(doc(db,"posts",workId),{
      comments: arrayUnion({userId:currentUser.uid, text})
    });
    input.value="";
  }catch(e){ alert("Failed: "+e.message); }
};

window.toggleLike = async function(workId){
  if(!currentUser){
    alert("Please login to like");
    location.href = "login.html";
    return;
  }
  const work = allWorks.find(w=>w.id===workId);
  if(!work) return;
  const liked = work.likes.includes(currentUser.uid);
  try{
    await updateDoc(doc(db,"posts",workId),{
      likes: liked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid)
    });
  }catch(e){ alert("Failed to like/unlike"); }
};

function renderWorks(force=false){
  const hash = JSON.stringify(allWorks.map(w => ({
    id: w.id,
    likes: w.likes.length,
    comments: w.comments.length,
    status: w.status
  })));

  if(!force && hash === lastRenderHash) return;
  lastRenderHash = hash;

  worksContainer.innerHTML = "";
  let limit = distanceFilter.value;
  let cat = categoryFilter.value;
  let found = 0;

  for(const w of allWorks){
    if(w.status !== "open") continue;
    if(cat !== "all" && w.category !== cat) continue;

    let distText = "N/A";
    if(userLat && w.location?.lat){
      let dist = getDistance(userLat,userLng,w.location.lat,w.location.lng);
      distText = dist<1 ? Math.round(dist*1000)+" m" : dist.toFixed(2)+" km";
      if(limit!=="all" && dist>Number(limit)) continue;
    }

    const isSelfPost = currentUser && w.postedBy === currentUser.uid;
    found++;

    worksContainer.innerHTML += `
      <div class="work-card">
        <p><b>Category:</b> ${w.category}</p>
        <p><b>Description:</b> ${w.description}</p>
        <p>${w.category==="ride"?`From: ${w.from} → To: ${w.to} | Seats: ${w.seats}`:
            w.category==="work"?`Amount: ₹${w.amount}`:
            w.category==="idea"?`Type: ${w.ideaType}`:
            w.category==="problem"?`Type: ${w.problemType}`:""}</p>
        <p><b>Status:</b> <span class="status-badge status-open">${w.status}</span></p>
        <p><b>Sender:</b> ${w.senderName}</p>
        <p><b>Distance:</b> ${distText}</p>
        ${w.category !== "idea" ? 
          `<button onclick="acceptWork('${w.id}')" ${isSelfPost?"disabled":""}>Accept Work</button>` 
          : ""}
        <button onclick="toggleLike('${w.id}')">❤️ ${w.likes.length}</button>
        <button onclick="toggleComments('${w.id}')">💬 ${w.comments.length}</button>
        <div class="comment-section" id="comments-${w.id}">
          ${w.comments.map(c=>`<div class="comment-item">${c.text}</div>`).join("")}
          <div class="comment-box">
            <input type="text" placeholder="Add comment">
            <button onclick="addComment('${w.id}', this.previousElementSibling)">Add</button>
          </div>
        </div>
      </div>`;
  }

  if(!found){
    worksContainer.innerHTML='<div class="empty">No works found</div>';
  }
}

// PWA install prompt handling (unchanged)
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installBtn').style.display = 'block';
});

document.getElementById('installBtn').addEventListener('click', async () => {
    if(deferredPrompt){
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        document.getElementById('installBtn').style.display = 'none';
    }
});
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js")
    .then(() => console.log("✅ Service Worker registered"))
    .catch(err => console.log("❌ SW registration failed", err));
}
</script>



</body>
</html>
