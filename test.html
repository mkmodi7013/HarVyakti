<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Requester</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{font-family:Arial;background:#f4f6f8;padding:20px;}
.box{background:#fff;padding:15px;border-radius:8px;max-width:400px;margin:auto;}
input,button{width:100%;padding:10px;margin-top:10px;}
button{background:#007bff;color:#fff;border:none;border-radius:5px;}
</style>
</head>

<body>

<div class="box">
  <h3>Generate Work</h3>
  <input id="work" placeholder="Enter work details">
  <button onclick="postWork()">Post Work</button>
  <p id="status"></p>
</div>

<script>
// 🔹 Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyDT4XZtLbYRsSwM5doqkjMANf2d6oWLCuE",
  authDomain: "harvyakti.firebaseapp.com",
  databaseURL: "https://harvyakti-default-rtdb.firebaseio.com",
  projectId: "harvyakti",
  storageBucket: "harvyakti.appspot.com",
  messagingSenderId: "394497239762",
  appId: "1:394497239762:web:8445303e857f9aeff8db0b",
  measurementId: "G-EPRQZ4ZH5T"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Notification permission
if ("Notification" in window) Notification.requestPermission();

function postWork(){
  const work = document.getElementById("work").value;
  if(!work) return alert("Enter work");

  db.collection("test").add({
    work: work,
    accepted: false,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  document.getElementById("status").innerText =
    "Work saved. Waiting for acceptance...";
}

// 🔔 Listen for acceptance
db.collection("test")
  .where("accepted","==",true)
  .onSnapshot(snapshot=>{
    snapshot.forEach(doc=>{
      if(Notification.permission==="granted"){
        new Notification("Work Accepted",{
          body:"Your work has been accepted 🎉"
        });
      }
    });
  });
</script>

</body>
</html>
