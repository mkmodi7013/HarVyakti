<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Requester - Generate Work</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f4f6f8;padding:20px;}
.box{background:#fff;padding:15px;border-radius:8px;max-width:400px;margin:auto;}
input,button{width:100%;padding:10px;margin-top:10px;}
button{background:#007bff;color:#fff;border:none;border-radius:5px;}
</style>
</head>

<body>

<div class="box">
  <h3>Generate Work</h3>
  <input id="work" placeholder="Enter work description">
  <button onclick="generateWork()">Post Work</button>
  <p id="status"></p>
</div>

<script>
// Ask notification permission
if ("Notification" in window) {
  Notification.requestPermission();
}

function generateWork(){
  const work = document.getElementById("work").value;
  if(!work) return alert("Enter work");

  localStorage.setItem("workData", JSON.stringify({
    work: work,
    accepted: false
  }));

  document.getElementById("status").innerText =
    "Work posted. Waiting for acceptance...";
}
</script>

</body>
</html>
